# 실제 Windows에서 설치 명령 → 추출기 → 받아쓰기 → 타이틀 자막 읽기까지 끝까지 시험
name: windows-test
# 무료 사용량 아끼기: Windows에 영향 있는 파일이 바뀔 때만 자동 실행 (화면 디자인만 고칠 땐 안 돎) + 필요하면 수동 실행
on:
  push:
    paths:
      - 'helper/**'
      - 'web/install.cmd'
      - 'web/uninstall.cmd'
      - 'web/install_win.py'
      - '.github/workflows/windows-test.yml'
  workflow_dispatch:
concurrency:  # 연달아 고치면 앞 테스트는 취소하고 마지막 것만
  group: windows-test
  cancel-in-progress: true

jobs:
  install-and-run:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 사이트에서 안내하는 건 cmd 방식뿐 (예전 PowerShell 방식은 수동 실행 때만 시험하려면 여기에 powershell 추가)
        installer: [cmd]
    steps:
      - uses: actions/checkout@v4

      - name: 한국어 글자 인식 기능 설치 (한국어 Windows에는 기본 포함)
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name "Language.OCR~~~ko-KR~0.0.1.0" | Out-Null
          Get-WindowsCapability -Online -Name "Language.OCR~~~ko-KR*" | Format-Table Name, State

      - name: 설치 파일(zip) 만들고 로컬 서버로 내보내기
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\site"
          New-Item -ItemType Directory -Force "$stage\pkg\reels-abc-helper" | Out-Null
          Copy-Item helper, web -Destination "$stage\pkg\reels-abc-helper" -Recurse
          Remove-Item "$stage\pkg\reels-abc-helper\helper\.env" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage\pkg\reels-abc-helper" -DestinationPath "$stage\reels-abc-helper.zip"
          Copy-Item web\install.ps1, web\install.cmd, web\uninstall.cmd, web\install_win.py, tests\sample.mp4 -Destination $stage
          Start-Process python -ArgumentList "`"$PWD\tests\serve.py`"", "`"$stage`"" -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { try { (Invoke-WebRequest http://127.0.0.1:8000/install.ps1 -UseBasicParsing).StatusCode; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { throw "test file server did not start" }

      - name: 백신·회사망처럼 인터넷 검사 프록시 켜기 (자체 인증서를 Windows에만 등록)
        if: matrix.installer == 'cmd'
        shell: pwsh
        run: |
          python -m pip install -q mitmproxy
          Start-Process mitmdump -ArgumentList '--listen-port','8080','-q' -WindowStyle Hidden
          foreach ($i in 1..30) { if (Test-Path "$env:USERPROFILE\.mitmproxy\mitmproxy-ca-cert.cer") { break }; Start-Sleep 1 }
          certutil -addstore Root "$env:USERPROFILE\.mitmproxy\mitmproxy-ca-cert.cer"
          "HTTPS_PROXY=http://127.0.0.1:8080" >> $env:GITHUB_ENV
          "HTTP_PROXY=http://127.0.0.1:8080" >> $env:GITHUB_ENV
          "NO_PROXY=127.0.0.1,localhost" >> $env:GITHUB_ENV
          # 확인: 파이썬 기본 인증서 목록(certifi)으로는 실패해야 사용자 PC와 같은 상황
          python -m pip install -q certifi httpx
          python -c "import httpx; httpx.get('https://huggingface.co', proxy='http://127.0.0.1:8080')" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "재현 실패: 검사 프록시인데 그냥 통과됨" } else { "재현 OK: 기본 인증서 목록으로는 접속 실패" }
          exit 0

      - name: 사용자와 같은 방식으로 설치 (PowerShell 방식)
        if: matrix.installer == 'powershell'
        shell: powershell
        env:
          REELS_BASE: http://127.0.0.1:8000
          REELS_NO_OPEN: '1'
        run: |
          powershell -ExecutionPolicy Bypass -c "irm http://127.0.0.1:8000/install.ps1 | iex"
          if ($LASTEXITCODE -ne 0) { throw "install failed" }

      - name: 사용자와 같은 방식으로 설치 (사이트의 명령을 Windows PowerShell 5.1에 붙여넣은 경우)
        if: matrix.installer == 'cmd'
        shell: powershell
        env:
          REELS_BASE: http://127.0.0.1:8000
          REELS_NO_OPEN: '1'
          # 허깅페이스가 막힌 네트워크 재현 → GitHub 사본으로 받는지 확인
          HF_ENDPOINT: https://127.0.0.1:9
        run: |
          cmd /c "cd /d %TEMP% && curl --ssl-revoke-best-effort -fsSL http://127.0.0.1:8000/install.cmd -o reels-install.cmd && reels-install.cmd"
          if ($LASTEXITCODE) { throw "install failed ($LASTEXITCODE)" }

      - name: 받아쓰기 모델을 GitHub 사본에서 받았는지
        if: matrix.installer == 'cmd'
        shell: pwsh
        run: |
          $m = "$env:USERPROFILE\ReelsExtractor\models\large-v3-turbo\model.bin"
          if (-not (Test-Path $m)) { throw "GitHub 사본 모델 없음" }
          "모델 크기: $((Get-Item $m).Length)"

      - name: 설치 결과 확인 (바로가기 · 자동 실행 · 추출기)
        shell: pwsh
        run: |
          $desk = [Environment]::GetFolderPath('Desktop'); $startup = [Environment]::GetFolderPath('Startup'); $progs = [Environment]::GetFolderPath('Programs')
          $ext = if ('${{ matrix.installer }}' -eq 'cmd') { 'url' } else { 'lnk' }
          foreach ($f in @("$desk\릴스 A+B=C.$ext", "$progs\릴스 A+B=C.$ext")) { if (-not (Test-Path $f)) { throw "없음: $f" } else { "OK $f" } }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).ReelsExtractor
          if (-not $run -and -not (Test-Path "$startup\ReelsExtractor.lnk")) { throw "자동 실행 설정 없음" } else { "자동 실행: $run" }
          $sh = New-Object -ComObject WScript.Shell
          if ($ext -eq 'lnk') {
            $sa = New-Object -ComObject Shell.Application
            $item = $sa.Namespace($desk).ParseName('릴스 A+B=C.lnk'); $link = $item.GetLink
            "바로가기 대상: $($link.Path) $($link.Arguments)"
          } else { Get-Content "$desk\릴스 A+B=C.url" }
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\reelsabc\shell\open\command').'(default)'
          "reelsabc:// 링크: $cmd"
          if ($cmd -notmatch 'msedge' -or $cmd -notmatch '--app=') { throw "프로그램 열기 링크 등록 안 됨" }
          $h = Invoke-RestMethod http://127.0.0.1:8765/api/health; $h | ConvertTo-Json
          if (-not $h.ok -or $h.engine -ne 'faster-whisper') { throw "추출기 상태 이상" }
          (Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).StatusCode

      - name: 받아쓰기 + 타이틀 자막 읽기 (테스트 영상)
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $body = @{ url = 'http://127.0.0.1:8000/sample.mp4'; model = 'auto'; language = 'ko' } | ConvertTo-Json
          try {
            $r = Invoke-RestMethod http://127.0.0.1:8765/api/transcribe -Method Post -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ContentType 'application/json; charset=utf-8' -Headers @{ Origin = 'http://127.0.0.1:8765' } -TimeoutSec 900
          } catch { "ERROR BODY: $($_.ErrorDetails.Message)"; throw }
          "걸린 시간: $([int]$sw.Elapsed.TotalSeconds)초"
          "타이틀 자막: $($r.screen_title)"
          "문장 수: $($r.segments.Count)"
          $r.segments | ForEach-Object { "  [$($_.start)] $($_.text)" }
          $all = ($r.segments | ForEach-Object { $_.text }) -join ' '
          if ($r.segments.Count -lt 1) { throw "받아쓰기 결과 없음" }
          if ($all -notmatch '월급' -or $all -notmatch '댓글') { throw "받아쓰기 내용이 이상함" }
          if ($r.screen_title -notmatch '1억') { throw "타이틀 자막을 못 읽음: '$($r.screen_title)'" }
          # 두 번째 추출 (모델이 이미 올라온 상태 = 사용자가 두 번째 릴스를 넣을 때 속도)
          $sw2 = [Diagnostics.Stopwatch]::StartNew()
          $r2 = Invoke-RestMethod http://127.0.0.1:8765/api/transcribe -Method Post -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ContentType 'application/json; charset=utf-8' -Headers @{ Origin = 'http://127.0.0.1:8765' } -TimeoutSec 900
          "두 번째 추출 걸린 시간: $([int]$sw2.Elapsed.TotalSeconds)초"
          # 구간 재생용 영상 전송 (건너뛰기 지원)
          $v = Invoke-WebRequest "http://127.0.0.1:8765$($r.video)" -Headers @{ Range = 'bytes=0-99' } -UseBasicParsing
          "영상 부분 전송: $($v.StatusCode)"
          if ($v.StatusCode -ne 206) { throw "영상 구간 전송 실패" }

      - name: 데이터 저장 확인
        shell: pwsh
        run: |
          $s = @{ refs = @(@{ id = 'x'; group = 'A'; title = '테스트'; units = @() }); saved = @() } | ConvertTo-Json -Depth 5
          Invoke-RestMethod http://127.0.0.1:8765/api/state -Method Post -Body ([Text.Encoding]::UTF8.GetBytes($s)) -ContentType 'application/json; charset=utf-8' -Headers @{ Origin = 'http://127.0.0.1:8765' } | Out-Null
          $back = Invoke-RestMethod http://127.0.0.1:8765/api/state
          if ($back.refs[0].title -ne '테스트') { throw "저장 실패" } else { "저장 OK" }

      - name: 인스타 로그인 창 (엣지 전용 창 열기 → 로그인 정보 읽기 → 닫기)
        shell: pwsh
        run: |
          $h = @{ Origin = 'http://127.0.0.1:8765' }
          Invoke-RestMethod http://127.0.0.1:8765/api/iglogin -Method Post -Body '{}' -ContentType 'application/json' -Headers $h | Out-Null
          $ok = $false
          foreach ($i in 1..30) { Start-Sleep 2; try { $v = Invoke-RestMethod http://127.0.0.1:9223/json/version -TimeoutSec 3; $ok = $true; break } catch {} }
          if (-not $ok) { throw "로그인 창(엣지)이 열리지 않음" }
          "브라우저: $($v.Browser)"
          Start-Sleep 6
          $py = "$env:USERPROFILE\ReelsExtractor\.venv\Scripts\python.exe"
          $code = "import sys; sys.path.insert(0, r'$env:USERPROFILE\ReelsExtractor\helper'); import server; ws = server._cdp_browser_ws(); ck = server._ws_call(ws, 'Storage.getCookies')['cookies']; names = sorted({c['name'] for c in ck if 'instagram' in c['domain']}); print('인스타 쿠키:', names); assert 'csrftoken' in names or 'mid' in names or 'ig_did' in names; server._ws_call(server._cdp_browser_ws(), 'Browser.close')"
          & $py -X utf8 -c $code
          if ($LASTEXITCODE) { throw "로그인 정보 읽기 실패" }
          Start-Sleep 6
          $st = Invoke-RestMethod http://127.0.0.1:8765/api/iglogin
          "상태: $($st.state) / 로그인: $($st.loggedIn)"
          if ($st.state -ne 'idle') { throw "창을 닫았는데 상태가 그대로" }

      - name: 로그인 필요한 릴스 → 로그인 안내가 나오는지
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $body = @{ url = 'https://www.instagram.com/reels/Db2aB_rM2qa/'; model = 'auto' } | ConvertTo-Json
          try { Invoke-RestMethod http://127.0.0.1:8765/api/transcribe -Method Post -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ContentType 'application/json; charset=utf-8' -Headers @{ Origin = 'http://127.0.0.1:8765' } -TimeoutSec 900; "받아짐(로그인 없이)" }
          catch { $m = $_.ErrorDetails.Message; "오류 메시지: $($m.Substring(0, [Math]::Min(200, $m.Length)))" }
          "걸린 시간: $([int]$sw.Elapsed.TotalSeconds)초"

      - name: (참고) 실제 인스타 릴스 — 데이터센터라 막힐 수 있음
        continue-on-error: true
        shell: pwsh
        run: |
          $body = @{ url = 'https://www.instagram.com/reel/DeGJIEHOYic/'; model = 'auto' } | ConvertTo-Json
          $r = Invoke-RestMethod http://127.0.0.1:8765/api/transcribe -Method Post -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ContentType 'application/json; charset=utf-8' -Headers @{ Origin = 'http://127.0.0.1:8765' } -TimeoutSec 900
          "타이틀: $($r.screen_title) / 문장 $($r.segments.Count)개 / 좋아요 $($r.stats.likes)"
          $body = @{ url = 'https://www.instagram.com/reel/DdGPLetuVji/'; model = 'auto' } | ConvertTo-Json
          $r = Invoke-RestMethod http://127.0.0.1:8765/api/transcribe -Method Post -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ContentType 'application/json; charset=utf-8' -Headers @{ Origin = 'http://127.0.0.1:8765' } -TimeoutSec 900
          "타이틀2: $($r.screen_title) / 문장 $($r.segments.Count)개"

      - name: 추출기 로그
        if: always()
        shell: pwsh
        run: Get-Content "$env:USERPROFILE\ReelsExtractor\helper\helper.log" -Tail 60 -ErrorAction SilentlyContinue

      - name: 지우기 (데이터는 남는지)
        if: matrix.installer == 'cmd'
        shell: pwsh
        run: |
          cmd /c "cd /d %TEMP% && curl --ssl-revoke-best-effort -fsSL http://127.0.0.1:8000/uninstall.cmd -o reels-uninstall.cmd && reels-uninstall.cmd"
          Start-Sleep 2
          if (Test-Path "$env:USERPROFILE\ReelsExtractor\helper") { throw "프로그램이 안 지워짐" }
          if (-not (Test-Path "$env:USERPROFILE\ReelsExtractor\data\state.json")) { throw "데이터가 지워짐" }
          if (Test-Path "$env:USERPROFILE\Desktop\릴스 A+B=C.url") { throw "바로가기 남음" }
          "지우기 OK (데이터 남음)"
